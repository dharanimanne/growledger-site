name: Check site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate HTML
        run: npx -y html-validate@9 --rule 'no-inline-style:off' --rule 'doctype-style:off' public/index.html public/404.html
      - name: Validate JSON-LD, manifest and sitemap
        run: |
          python3 -c "import re,json;s=open('public/index.html').read();json.loads(re.search(r'ld\+json\">(.*?)</script>',s,re.S).group(1))"
          python3 -c "import json;json.load(open('public/site.webmanifest'))"
          python3 -c "import xml.dom.minidom as m;m.parse('public/sitemap.xml')"
      - name: Check local file references exist
        run: |
          python3 - <<'PY'
          import re,os,sys
          missing=[]
          for page in ('public/index.html','public/404.html','public/css/styles.css'):
              s=open(page).read()
              for ref in re.findall(r'(?:href|src)="([^"#:]+)"|url\(([^)]+)\)',s):
                  ref=(ref[0] or ref[1]).strip("'\"")
                  if not ref or ref.startswith(('http','mailto','tel','data:','#')): continue
                  base='public' if ref.startswith('/') else os.path.dirname(page)
                  if not os.path.exists(os.path.normpath(os.path.join(base,ref.lstrip('/')))): missing.append(f'{page}: {ref}')
          print('\n'.join(missing) or 'all references found'); sys.exit(bool(missing))
          PY
      - name: Wrangler dry run
        run: npx -y wrangler@4 deploy --dry-run
