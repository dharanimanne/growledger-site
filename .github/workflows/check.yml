name: Check site

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate every page, SEO metadata, sitemap and assets
        run: npm run check
      - name: Install QA browser
        run: npx playwright install --with-deps chromium
      - name: Run responsive, accessibility and contact regression checks
        run: |
          npm run dev > /tmp/growledger-wrangler.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8790/ > /dev/null; then break; fi
            sleep 1
          done
          npm run check:browser
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-verification
          path: output/playwright/
      - name: Wrangler dry run
        run: npm run check:deploy
